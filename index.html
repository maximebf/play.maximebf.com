<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play · Games by Maxime</title>
  <meta name="description" content="Small games made by Maxime Bouroumeau-Fuseau. Pick one and play in your browser.">
  <meta name="theme-color" content="#120d24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Play">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main>
    <ul class="catalog">
      <!--
        To add a game, copy one <li class="tile"> block: set the link and a 4:3 poster in games/.
        Images under games/ referenced here are cached for offline use automatically (see sw.js).
      -->
      <li class="tile">
        <a href="https://nanodefenders.play.maximebf.com/">
          <img src="games/nano-defenders.webp" width="1200" height="900" alt="Nano Défenseurs">
        </a>
      </li>
    </ul>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
