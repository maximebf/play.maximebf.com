<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play · Games by Maxime</title>
  <meta name="description" content="Small games made by Maxime Bouroumeau-Fuseau. Pick one and play in your browser.">
  <meta name="theme-color" content="#120d24">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <main>
    <ul class="catalog">
      <!--
        To add a game, copy one <li class="tile"> block: set the link and a 4:3 poster in games/.
      -->
      <li class="tile">
        <a href="https://nanodefenders.play.maximebf.com/">
          <img src="games/nano-defenders.webp" width="1200" height="900" alt="Nano Défenseurs">
        </a>
      </li>
    </ul>
  </main>
  <script>
    // The site used to install an offline service worker. Remove it and its cache
    // from devices that still have it. Safe to delete once old visitors have come back.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
    }
  </script>
</body>
</html>
